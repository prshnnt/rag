<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RAG Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181c23;
      --panel-2: #20252f;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --accent-2: #4a76d8;
      --ok: #3ecf8e;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.2px; }
    header .count { color: var(--muted); font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px 32px;
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .panel h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 600; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .row { display: flex; gap: 12px; align-items: flex-end; }
    .row > div { flex: 1; }
    .row .k { flex: 0 0 120px; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: var(--accent-2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 13px; min-height: 18px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .results { display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow: auto; }
    .hit {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .hit-meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .hit-meta .score { color: var(--accent); }
    .hit-content { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <header>
    <h1>RAG Playground</h1>
    <div class="count">index: <span id="count">…</span></div>
  </header>

  <main>
    <section class="panel">
      <h2>1. Ingest a file</h2>
      <form id="ingest-form">
        <label for="file">Upload (.pdf, .txt, .md)</label>
        <input id="file" name="file" type="file" accept=".pdf,.txt,.md,.markdown" required />
        <button type="submit" id="ingest-btn">Upload &amp; index</button>
        <div id="ingest-status" class="status"></div>
      </form>

      <h2 style="margin-top:28px">2. Query</h2>
      <form id="query-form">
        <div class="row">
          <div>
            <label for="q">Search</label>
            <input id="q" name="q" type="text" placeholder="ask something about your documents…" required />
          </div>
          <div class="k">
            <label for="k">k</label>
            <input id="k" name="k" type="number" min="1" max="50" value="4" />
          </div>
        </div>
        <button type="submit" id="query-btn">Search</button>
        <div id="query-status" class="status"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Results</h2>
      <div id="results" class="results"></div>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);

  async function refreshCount() {
    try {
      const r = await fetch("/stats");
      const j = await r.json();
      $("count").textContent = j.count;
    } catch { $("count").textContent = "?"; }
  }
  refreshCount();

  $("ingest-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = $("file").files[0];
    if (!f) return;
    const btn = $("ingest-btn");
    const status = $("ingest-status");
    btn.disabled = true;
    status.className = "status";
    status.textContent = "uploading…";
    try {
      const fd = new FormData();
      fd.append("file", f);
      const r = await fetch("/ingest", { method: "POST", body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      status.className = "status ok";
      status.textContent = `indexed ${j.chunks} chunks from ${j.filename} (total: ${j.collection_size})`;
      refreshCount();
    } catch (err) {
      status.className = "status err";
      status.textContent = "error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  $("query-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    const k = parseInt($("k").value, 10) || 4;
    if (!q) return;
    const btn = $("query-btn");
    const status = $("query-status");
    const out = $("results");
    btn.disabled = true;
    status.className = "status";
    status.textContent = "searching…";
    out.innerHTML = "";
    try {
      const r = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q, k }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      status.className = "status";
      status.textContent = `${j.length} hit(s)`;
      for (const h of j) {
        const div = document.createElement("div");
        div.className = "hit";
        const meta = document.createElement("div");
        meta.className = "hit-meta";
        const score = h.score != null ? `score: ${h.score.toFixed(4)}` : "";
        meta.innerHTML = `<span>${h.source ?? "?"}</span>${h.page ? `<span>p.${h.page}</span>` : ""}<span class="score">${score}</span>`;
        const body = document.createElement("div");
        body.className = "hit-content";
        body.textContent = h.content;
        div.appendChild(meta);
        div.appendChild(body);
        out.appendChild(div);
      }
    } catch (err) {
      status.className = "status err";
      status.textContent = "error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
